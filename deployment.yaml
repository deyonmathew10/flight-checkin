
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flight-checkin
spec:
  replicas: 3
  selector:
    matchLabels:
      app: flight-checkin
  template:
    metadata:
      labels:
        app: flight-checkin
    spec:
      containers:
        - name: flight-checkin
          image: flight-checkin-flight-checkin:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
